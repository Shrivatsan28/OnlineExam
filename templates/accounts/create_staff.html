{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 500px; margin: 0 auto;">
    <h2 style="margin-top: 0;">Create Staff Account</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted)">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
            <p style="color: var(--danger); font-size: 0.8rem;">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.8rem;">Create Staff</button>
    </form>
</div>
{% endblock %}
