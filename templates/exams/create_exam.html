{% extends 'base.html' %}

{% block content %}
<div class="card" style="max-width: 600px; margin: 0 auto;">
    <h2 style="margin-top: 0;">Create Exam</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.5rem; color: var(--text-muted)">{{ field.label }}</label>
            <div class="form-control-wrapper">
                {{ field }}
            </div>
        </div>
        {% endfor %}
        <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Continue to Add
            Questions</button>
    </form>
</div>

<style>
    input,
    textarea,
    select {
        width: 100%;
        padding: 0.8rem;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        box-sizing: border-box;
    }
</style>
{% endblock %}
